id: 1corintios-6

title: 1 Corintios 6

questions:

  - question: ¿Qué problema menciona Pablo entre los creyentes?
    answers:
      - text: Pleitos entre hermanos
        correct: true
      - text: Falta de reuniones
        correct: false
      - text: Escasez de alimento
        correct: false
      - text: Idolatría romana
        correct: false

  - question: ¿Ante quiénes llevaban sus casos algunos creyentes?
    answers:
      - text: Ante tribunales injustos
        correct: true
      - text: Ante los apóstoles en Jerusalén
        correct: false
      - text: Ante los sacerdotes judíos
        correct: false
      - text: Ante los pobres
        correct: false

  - question: ¿Qué dice Pablo que juzgarán los santos?
    answers:
      - text: Al mundo
        correct: true
      - text: A los ángeles caídos solamente
        correct: false
      - text: A Roma
        correct: false
      - text: A Israel
        correct: false

  - question: ¿Qué sería mejor según Pablo que tener pleitos?
    answers:
      - text: Sufrir el agravio
        correct: true
      - text: Vengarse
        correct: false
      - text: Demandar públicamente
        correct: false
      - text: Buscar apoyo político
        correct: false

  - question: ¿Quiénes no heredarán el reino de Dios?
    answers:
      - text: Los injustos
        correct: true
      - text: Los pobres
        correct: false
      - text: Los extranjeros
        correct: false
      - text: Los enfermos
        correct: false

  - question: ¿Qué habían sido algunos de los corintios?
    answers:
      - text: Lavados, santificados y justificados
        correct: true
      - text: Coronados reyes
        correct: false
      - text: Sacerdotes levíticos
        correct: false
      - text: Gobernadores romanos
        correct: false

  - question: ¿Qué afirma Pablo sobre el cuerpo del creyente?
    answers:
      - text: Es miembro de Cristo
        correct: true
      - text: No tiene importancia
        correct: false
      - text: Pertenece al Estado
        correct: false
      - text: Debe ser destruido
        correct: false

  - question: ¿Contra qué pecado manda Pablo huir?
    answers:
      - text: La inmoralidad sexual
        correct: true
      - text: La pobreza
        correct: false
      - text: La agricultura
        correct: false
      - text: La enfermedad
        correct: false

  - question: ¿Qué es el cuerpo del creyente?
    answers:
      - text: Templo del Espíritu Santo
        correct: true
      - text: Una prisión inútil
        correct: false
      - text: Una carga temporal
        correct: false
      - text: Una sombra sin valor
        correct: false

  - question: ¿Qué dice Pablo que fueron los creyentes?
    answers:
      - text: Comprados por precio
        correct: true
      - text: Vendidos a Roma
        correct: false
      - text: Hechos sacerdotes levíticos
        correct: false
      - text: Escogidos como gobernantes
        correct: false