id: 1corintios-3-4

title: 1 Corintios 3–4

questions:

  - question: ¿Cómo describe Pablo a los corintios en 1 Corintios 3?
    answers:
      - text: Como niños en Cristo
        correct: true
      - text: Como maestros maduros
        correct: false
      - text: Como gobernantes
        correct: false
      - text: Como extranjeros
        correct: false

  - question: ¿Qué evidenciaba la carnalidad entre ellos?
    answers:
      - text: Celos y contiendas
        correct: true
      - text: Ayuno constante
        correct: false
      - text: Falta de reuniones
        correct: false
      - text: Pobreza económica
        correct: false

  - question: ¿Qué dice Pablo que hizo Apolos?
    answers:
      - text: Regó
        correct: true
      - text: Bautizó a todos
        correct: false
      - text: Construyó el templo
        correct: false
      - text: Gobernó Jerusalén
        correct: false

  - question: ¿Quién daba el crecimiento?
    answers:
      - text: Dios
        correct: true
      - text: Pablo
        correct: false
      - text: Apolos
        correct: false
      - text: Pedro
        correct: false

  - question: ¿Cuál es el único fundamento mencionado por Pablo?
    answers:
      - text: Jesucristo
        correct: true
      - text: Moisés
        correct: false
      - text: Abraham
        correct: false
      - text: La ley
        correct: false

  - question: ¿Qué son los creyentes colectivamente según Pablo?
    answers:
      - text: Templo de Dios
        correct: true
      - text: Ejército romano
        correct: false
      - text: Nación política
        correct: false
      - text: Escuela filosófica
        correct: false

  - question: ¿Cómo debían considerar a Pablo y a los demás ministros?
    answers:
      - text: Como servidores de Cristo
        correct: true
      - text: Como gobernantes absolutos
        correct: false
      - text: Como filósofos griegos
        correct: false
      - text: Como reyes terrenales
        correct: false

  - question: ¿Qué se requiere de los administradores?
    answers:
      - text: Que sean hallados fieles
        correct: true
      - text: Que sean ricos
        correct: false
      - text: Que sean famosos
        correct: false
      - text: Que sean elocuentes
        correct: false

  - question: ¿Qué decía Pablo que los corintios ya tenían?
    answers:
      - text: Ya están saciados y ya han llegado a ser ricos
        correct: true
      - text: Ya conquistaron Roma
        correct: false
      - text: Ya terminaron la carrera
        correct: false
      - text: Ya conocen toda profecía
        correct: false

  - question: ¿Qué envió Pablo a Corinto para recordarles sus caminos?
    answers:
      - text: A Timoteo
        correct: true
      - text: A Tito
        correct: false
      - text: A Lucas
        correct: false
      - text: A Bernabé
        correct: false