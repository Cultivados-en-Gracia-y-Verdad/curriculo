id: 1corintios-15b-16

title: 1 Corintios 15:35–58 y 16

questions:

  - question: ¿Qué imagen usa Pablo para explicar la resurrección del cuerpo?
    answers:
      - text: Una semilla que es sembrada
        correct: true
      - text: Una torre edificada
        correct: false
      - text: Un barco en el mar
        correct: false
      - text: Una espada afilada
        correct: false

  - question: ¿Cómo describe Pablo el cuerpo resucitado?
    answers:
      - text: Incorruptible y glorioso
        correct: true
      - text: Débil y terrenal
        correct: false
      - text: Invisible y vacío
        correct: false
      - text: Igual al cuerpo presente
        correct: false

  - question: ¿Qué contraste establece Pablo entre Adán y Cristo?
    answers:
      - text: Adán es terrenal y Cristo es celestial
        correct: true
      - text: Ambos son llamados reyes
        correct: false
      - text: Ambos son sacerdotes
        correct: false
      - text: Adán resucitó primero
        correct: false

  - question: ¿Qué sucederá a los creyentes según Pablo?
    answers:
      - text: Todos serán transformados
        correct: true
      - text: Todos dormirán
        correct: false
      - text: Todos permanecerán iguales
        correct: false
      - text: Todos serán jueces de Israel
        correct: false

  - question: ¿Qué será devorado en victoria?
    answers:
      - text: La muerte
        correct: true
      - text: El mar
        correct: false
      - text: El templo
        correct: false
      - text: Roma
        correct: false

  - question: ¿Cómo deben vivir los creyentes por causa de la resurrección?
    answers:
      - text: Firmes y constantes en la obra del Señor
        correct: true
      - text: Separados completamente del mundo
        correct: false
      - text: Esperando sin trabajar
        correct: false
      - text: Buscando señales continuamente
        correct: false

  - question: ¿Para quién era la ofrenda organizada por Pablo?
    answers:
      - text: Para los santos
        correct: true
      - text: Para los soldados romanos
        correct: false
      - text: Para los comerciantes griegos
        correct: false
      - text: Para reconstruir el templo
        correct: false

  - question: ¿Qué dice Pablo acerca de Timoteo?
    answers:
      - text: Hace la obra del Señor igual que Pablo
        correct: true
      - text: Debe permanecer siempre en Éfeso
        correct: false
      - text: No debe enseñar públicamente
        correct: false
      - text: Solo sirve a las iglesias de Galacia
        correct: false

  - question: ¿Qué exhortación hace Pablo en 1 Corintios 16:13?
    answers:
      - text: Estén alerta y permanezcan firmes en la fe
        correct: true
      - text: Busquen hablar más lenguas
        correct: false
      - text: No trabajen más
        correct: false
      - text: Esperen nuevas revelaciones
        correct: false

  - question: ¿Cómo concluye Pablo la carta?
    answers:
      - text: Deseando gracia y amor en Cristo Jesús
        correct: true
      - text: Ordenando un ayuno obligatorio
        correct: false
      - text: Pidiendo construir un templo
        correct: false
      - text: Nombrando nuevos apóstoles
        correct: false