title: "Quiz 1 — 1 Timoteo 1:1-20"

questions:
  - question: "¿Cuál es el propósito de la instrucción según 1 Timoteo 1:5?"
    options:
      - "Aumentar el conocimiento"
      - "Ganar discusiones"
      - "El amor nacido de un corazón puro, buena conciencia y fe sincera"
      - "Cumplir la ley"
    answer: 2

  - question: "¿Qué había encargado Pablo a Timoteo en Éfeso?"
    options:
      - "Organizar viajes misioneros"
      - "Corregir a los ancianos"
      - "Mandar a algunos que no enseñaran doctrinas diferentes"
      - "Supervisar la colecta"
    answer: 2

  - question: "¿Qué producían los mitos y genealogías interminables en lugar de promover el plan de Dios?"
    options:
      - "Edificación"
      - "Discusiones"
      - "Unidad"
      - "Sabiduría"
    answer: 1

  - question: "¿De qué se desviaron algunos según 1 Timoteo 1:6?"
    options:
      - "De Jerusalén"
      - "Del propósito de la instrucción"
      - "Del templo"
      - "De la oración"
    answer: 1

  - question: "Según esta sección, ¿qué problema tenía la ley?"
    options:
      - "La ley era mala"
      - "La ley había sido abolida"
      - "Algunos la estaban usando incorrectamente"
      - "La ley era insuficiente para Israel"
    answer: 2

  - question: "¿Para quién fue dada la ley según 1 Timoteo 1:9?"
    options:
      - "Para el justo"
      - "Para los apóstoles"
      - "Para los ancianos"
      - "Para los transgresores y rebeldes"
    answer: 3

  - question: "¿Conforme a qué debía entenderse el uso correcto de la ley?"
    options:
      - "Las tradiciones judías"
      - "El evangelio que fue encomendado a Pablo"
      - "Las genealogías"
      - "Las especulaciones"
    answer: 1

  - question: "¿Cómo se describió Pablo antes de recibir misericordia?"
    options:
      - "Maestro y escriba"
      - "Fariseo y sacerdote"
      - "Blasfemo, perseguidor y agresor"
      - "Gobernador romano"
    answer: 2

  - question: "¿Qué vino a hacer Cristo Jesús al mundo?"
    options:
      - "Enseñar la ley"
      - "Salvar a los pecadores"
      - "Fundar una religión"
      - "Juzgar a las naciones"
    answer: 1

  - question: "¿Cómo debía Timoteo pelear la buena batalla?"
    options:
      - "Con señales y milagros"
      - "Con autoridad política"
      - "Guardando la fe y una buena conciencia"
      - "Con sabiduría humana"
    answer: 2
