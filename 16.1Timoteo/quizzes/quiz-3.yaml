title: "Quiz 3 — 1 Timoteo 4:1-5:16"

questions:
  - question: "¿Qué sucederá con algunos en los últimos tiempos?"
    options:
      - "Serán enriquecidos"
      - "Se apartarán de la fe"
      - "Gobernarán naciones"
      - "Serán apóstoles"
    answer: 1

  - question: "¿Qué prohibían algunos falsos maestros?"
    options:
      - "Orar"
      - "Leer las Escrituras"
      - "Casarse y ciertos alimentos"
      - "Predicar"
    answer: 2

  - question: "¿Cómo describe Pablo todo lo creado por Dios?"
    options:
      - "Bueno"
      - "Peligroso"
      - "Temporal"
      - "Incierto"
    answer: 0

  - question: "¿Para qué debe ejercitarse el creyente?"
    options:
      - "La fama"
      - "La riqueza"
      - "La política"
      - "La piedad"
    answer: 3

  - question: "¿En qué debía ser ejemplo Timoteo?"
    options:
      - "Palabra, conducta, amor, fe y pureza"
      - "Milagros y señales"
      - "Autoridad y liderazgo"
      - "Ayuno y oración solamente"
    answer: 0

  - question: "¿En qué debía ocuparse Timoteo?"
    options:
      - "Administración"
      - "Lectura, exhortación y enseñanza"
      - "Construcción"
      - "Viajes"
    answer: 1

  - question: "¿Qué no debía descuidar Timoteo?"
    options:
      - "Sus amistades"
      - "Su salud"
      - "El don espiritual"
      - "Su ciudadanía"
    answer: 2

  - question: "¿Cómo debía tratar Timoteo a los hombres mayores?"
    options:
      - "Como siervos"
      - "Como padres"
      - "Como alumnos"
      - "Como enemigos"
    answer: 1

  - question: "¿Quién debía cuidar primero de una viuda que tiene hijos o nietos?"
    options:
      - "La iglesia"
      - "Los ancianos"
      - "El gobierno"
      - "Su familia"
    answer: 3

  - question: "¿Qué caracteriza a la viuda que en verdad es viuda?"
    options:
      - "Tiene riquezas"
      - "Está sola y espera en Dios"
      - "Viaja constantemente"
      - "Dirige la congregación"
    answer: 1