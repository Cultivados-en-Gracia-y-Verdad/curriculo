title: "Quiz 5 — 1 Timoteo 6:11-21"

questions:
  - question: "¿Qué debía hacer el hombre de Dios respecto a estas cosas?"
    options:
      - "Ignorarlas"
      - "Huir de ellas"
      - "Enseñarlas"
      - "Defenderlas"
    answer: 1

  - question: "¿Qué debía seguir Timoteo?"
    options:
      - "Riquezas"
      - "Tradiciones"
      - "Justicia, piedad, fe y amor"
      - "Filosofías"
    answer: 2

  - question: "¿Qué batalla debía pelear?"
    options:
      - "La batalla política"
      - "La buena batalla de la fe"
      - "La batalla militar"
      - "La batalla cultural"
    answer: 1

  - question: "¿De qué debía echar mano?"
    options:
      - "Del ministerio"
      - "Del liderazgo"
      - "De la riqueza"
      - "De la vida eterna"
    answer: 3

  - question: "¿Quién dio testimonio delante de Poncio Pilato?"
    options:
      - "Pedro"
      - "Pablo"
      - "Cristo Jesús"
      - "Juan"
    answer: 2

  - question: "¿Hasta cuándo debía guardar el mandamiento?"
    options:
      - "Hasta dejar Éfeso"
      - "Hasta su muerte"
      - "Hasta terminar la carta"
      - "Hasta la manifestación de Jesucristo"
    answer: 3

  - question: "¿Dónde habita Dios?"
    options:
      - "En Jerusalén"
      - "En luz inaccesible"
      - "En el templo"
      - "En el cielo visible"
    answer: 1

  - question: "¿Dónde no deben poner su esperanza los ricos?"
    options:
      - "En Dios"
      - "En las riquezas"
      - "En la gracia"
      - "En la iglesia"
    answer: 1

  - question: "¿Qué deben hacer los ricos?"
    options:
      - "Acumular más"
      - "Vender todo"
      - "Ser ricos en buenas obras"
      - "Abandonar sus bienes"
    answer: 2

  - question: "¿Qué debía guardar Timoteo?"
    options:
      - "Las tradiciones"
      - "El templo"
      - "La ley"
      - "Lo que se le había encomendado"
    answer: 3