title: "Quiz 4 — 1 Timoteo 5:17-6:10"

questions:
  - question: "¿Quiénes son dignos de doble honor?"
    options:
      - "Todos los creyentes"
      - "Los ricos"
      - "Los ancianos que gobiernan bien"
      - "Los diáconos solamente"
    answer: 2

  - question: "¿Qué dice la Escritura acerca del obrero?"
    options:
      - "Debe trabajar gratis"
      - "Es digno de su salario"
      - "Debe depender de limosnas"
      - "Debe enriquecerse"
    answer: 1

  - question: "¿Cuántos testigos se requieren para admitir acusación contra un anciano?"
    options:
      - "Uno"
      - "Dos o tres"
      - "Cuatro"
      - "Cinco"
    answer: 1

  - question: "¿Cómo debía actuar Timoteo?"
    options:
      - "Con parcialidad"
      - "Según amistades"
      - "Sin prejuicios ni parcialidad"
      - "Según tradición"
    answer: 2

  - question: "¿Qué no debía hacer con ligereza?"
    options:
      - "Predicar"
      - "Bautizar"
      - "Viajar"
      - "Imponer las manos"
    answer: 3

  - question: "¿Qué recomendó Pablo a Timoteo por sus frecuentes enfermedades?"
    options:
      - "Descansar más"
      - "Usar un poco de vino"
      - "Ayunar más"
      - "Dejar el ministerio"
    answer: 1

  - question: "¿Cómo deben considerar los esclavos a sus amos?"
    options:
      - "Como dignos de todo honor"
      - "Como enemigos"
      - "Como iguales sin respeto"
      - "Como incrédulos"
    answer: 0

  - question: "¿A qué es conforme la sana doctrina?"
    options:
      - "A la tradición"
      - "A la ley"
      - "A la piedad"
      - "A la cultura"
    answer: 2

  - question: "¿Qué produce la falsa enseñanza?"
    options:
      - "Unidad"
      - "Envidias y pleitos"
      - "Gozo"
      - "Santidad"
    answer: 1

  - question: "¿Cuál es la raíz de todos los males?"
    options:
      - "La pobreza"
      - "El dinero"
      - "El trabajo"
      - "El amor al dinero"
    answer: 3