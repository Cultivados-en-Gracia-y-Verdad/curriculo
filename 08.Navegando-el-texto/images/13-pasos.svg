<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">

<!-- BACKGROUND -->
<rect width="100%" height="100%" fill="#f2f4f7"></rect>

<style>
.title { font: 700 42px sans-serif; fill:#1f3c5b; }
.subtitle { font: 600 20px sans-serif; fill:#4a7db5; }

.box { fill:#ffffff; stroke:#cfd6df; stroke-width:2; rx:14; }
.numCircle { fill:#1f3c5b; }
.num { fill:#ffffff; font:700 16px sans-serif; }

.stepTitle { font:700 16px sans-serif; fill:#1f3c5b; }
.desc { font:14px sans-serif; fill:#444; }
.icon { stroke:#4a7db5; stroke-width:2; fill:none; }
</style>

<!-- HEADER -->
<text x="600" y="70" text-anchor="middle" class="title">
LOS 13 PASOS — PRIMER O
</text>
<text x="600" y="105" text-anchor="middle" class="subtitle">
OBSERVAR LA ESTRUCTURA DEL TEXTO
</text>

<!-- FUNCTION -->
<!-- BOX GENERATOR (MANUAL POSITIONS) -->

<!-- ROW 1 -->
<g transform="translate(40,140)">
  
<!-- 1 -->
<rect class="box" x="0" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="30" cy="30" r="18"></circle>
<text x="30" y="35" text-anchor="middle" class="num">1</text>
<text x="70" y="30" class="stepTitle">PASO 1: COPIAR EL TEXTO</text>
<text x="70" y="60" class="desc">Pega el texto completo</text>
<text x="70" y="80" class="desc">en un solo párrafo.</text>

<!-- 2 -->
<rect class="box" x="380" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="410" cy="30" r="18"></circle>
<text x="410" y="35" text-anchor="middle" class="num">2</text>
<text x="450" y="30" class="stepTitle">PASO 2: VERBOS FINITOS</text>
<text x="450" y="60" class="desc">Marca solo verbos</text>
<text x="450" y="80" class="desc">conjugados.</text>

<!-- 3 -->
<rect class="box" x="760" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="790" cy="30" r="18"></circle>
<text x="790" y="35" text-anchor="middle" class="num">3</text>
<text x="830" y="30" class="stepTitle">PASO 3: CLÁUSULAS</text>
<text x="830" y="60" class="desc">Separa líneas por</text>
<text x="830" y="80" class="desc">verbo finito.</text>

</g>

<!-- ROW 2 -->
<g transform="translate(40,280)">

<!-- 4 -->
<rect class="box" x="0" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="30" cy="30" r="18"></circle>
<text x="30" y="35" text-anchor="middle" class="num">4</text>
<text x="70" y="30" class="stepTitle">PASO 4: CONECTORES</text>
<text x="70" y="60" class="desc">Marca conectores</text>

<!-- 5 -->
<rect class="box" x="380" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="410" cy="30" r="18"></circle>
<text x="410" y="35" text-anchor="middle" class="num">5</text>
<text x="450" y="30" class="stepTitle">PASO 5: ESTRUCTURA</text>
<text x="450" y="60" class="desc">Organiza dependencia</text>

<!-- 6 -->
<rect class="box" x="760" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="790" cy="30" r="18"></circle>
<text x="790" y="35" text-anchor="middle" class="num">6</text>
<text x="830" y="30" class="stepTitle">PASO 6: USAR CONECTOR</text>
<text x="830" y="60" class="desc">Lee la relación</text>

</g>

<!-- ROW 3 -->
<g transform="translate(40,420)">

<!-- 7 -->
<rect class="box" x="0" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="30" cy="30" r="18"></circle>
<text x="30" y="35" text-anchor="middle" class="num">7</text>
<text x="70" y="30" class="stepTitle">PASO 7: REDUCIR</text>
<text x="70" y="60" class="desc">Elimina lo no esencial</text>

<!-- 8 -->
<rect class="box" x="380" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="410" cy="30" r="18"></circle>
<text x="410" y="35" text-anchor="middle" class="num">8</text>
<text x="450" y="30" class="stepTitle">PASO 8: TRONCO</text>
<text x="450" y="60" class="desc">Deja solo el tronco</text>

<!-- 9 -->
<rect class="box" x="760" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="790" cy="30" r="18"></circle>
<text x="790" y="35" text-anchor="middle" class="num">9</text>
<text x="830" y="30" class="stepTitle">PASO 9: COMPORTAMIENTO</text>
<text x="830" y="60" class="desc">Asigna función</text>

</g>

<!-- ROW 4 -->
<g transform="translate(40,560)">

<!-- 10 -->
<rect class="box" x="0" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="30" cy="30" r="18"></circle>
<text x="30" y="35" text-anchor="middle" class="num">10</text>
<text x="70" y="30" class="stepTitle">PASO 10: PATRONES</text>
<text x="70" y="60" class="desc">Detecta repetición</text>

<!-- 11 -->
<rect class="box" x="380" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="410" cy="30" r="18"></circle>
<text x="410" y="35" text-anchor="middle" class="num">11</text>
<text x="450" y="30" class="stepTitle">PASO 11: SEGUIR / PARAR</text>
<text x="450" y="60" class="desc">¿Continúa o se rompe?</text>

<!-- 12 -->
<rect class="box" x="760" y="0" width="360" height="120"></rect>
<circle class="numCircle" cx="790" cy="30" r="18"></circle>
<text x="790" y="35" text-anchor="middle" class="num">12</text>
<text x="830" y="30" class="stepTitle">PASO 12: UNIDAD</text>
<text x="830" y="60" class="desc">Define inicio y fin</text>

</g>

<!-- FINAL STEP -->
<g transform="translate(40,720)">
<rect class="box" x="0" y="0" width="1080" height="120"></rect>
<circle class="numCircle" cx="30" cy="30" r="18"></circle>
<text x="30" y="35" text-anchor="middle" class="num">13</text>
<text x="70" y="30" class="stepTitle">PASO 13: ACCIÓN DEL TRONCO</text>
<text x="70" y="60" class="desc">Autor + verbo permitido + contenido del tronco</text>
</g>

</svg>