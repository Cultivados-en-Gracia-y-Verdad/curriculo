<link rel="stylesheet" href="/css/roots.css">
<link rel="stylesheet" href="/css/custom.css">
<h1>{{ .Title }}</h1>

{{ .Content }}
<div class="search-bar"></div>
<input 
  type="text" 
  id="searchBox" 
  placeholder="Buscar: col 1:1, romanos, fe..."
  style="width: 100%; padding: 8px; margin: 10px 0;"
/>

<ul id="results"></ul>

<ul class="roots-list">
  {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{ end }}
</ul>

<script>
let DATA = [];

// load dataset
fetch('/roots/ROOTS-dataset/index.json')
  .then(res => res.json())
  .then(json => {
    DATA = json;
    console.log("Loaded:", DATA.length);
  });

const input = document.getElementById('searchBox');
const results = document.getElementById('results');

// normalize helper
function clean(str) {
  return str.toLowerCase().trim();
}

input.addEventListener('input', () => {
  const query = clean(input.value);
  results.innerHTML = '';

  if (!query) return;

  let matches = [];

  // 🔥 STEP 1 — handle references (like "col 1:1")
  if (query.includes(':')) {

    const parts = query.split(' ');
    let verse = null;
    let book = null;

    parts.forEach(p => {
      if (p.includes(':')) verse = p;
      else book = p;
    });

    matches = DATA.filter(item => {
      const title = clean(item.title);

      if (book) {
        return title.includes(book) && title.includes(verse);
      }

      return title.includes(verse);
    });
  }

  // 🔥 STEP 2 — fallback (VERY IMPORTANT)
  if (matches.length === 0) {
    matches = DATA.filter(item =>
      clean(item.title).includes(query) ||
      clean(item.content).includes(query)
    );
  }

  // 🔥 STEP 3 — render results
results.innerHTML = '';

matches.slice(0, 20).forEach(item => {
  const text = item.ref || item.content;
  const url = item.url;

  if (!text || text.trim() === '') return;

  const li = document.createElement('li');

  if (url) {
    const a = document.createElement('a');
    a.href = url;
    a.textContent = text;
    li.appendChild(a);
  } else {
    li.textContent = text;
  }

  results.appendChild(li);
});
});
</script>
