id: 1corintios-1-2

title: 1 Corintios 1–2

questions:

  - question: ¿Qué problema menciona Pablo al inicio respecto a los corintios?
    answers:
      - text: Divisiones entre ellos
        correct: true
      - text: Falta de alimentos
        correct: false
      - text: Persecución romana
        correct: false
      - text: Idolatría en Jerusalén
        correct: false

  - question: ¿Qué decían algunos dentro de la iglesia?
    answers:
      - text: “Yo soy de Pablo”
        correct: true
      - text: “Yo soy de Moisés”
        correct: false
      - text: “Yo soy de César”
        correct: false
      - text: “Yo soy de Gamaliel”
        correct: false

  - question: ¿Cómo describe Pablo el mensaje de la cruz para los que se pierden?
    answers:
      - text: Locura
        correct: true
      - text: Filosofía elevada
        correct: false
      - text: Tradición judía
        correct: false
      - text: Sabiduría política
        correct: false

  - question: ¿Qué escogió Dios para avergonzar a lo sabio?
    answers:
      - text: Lo necio del mundo
        correct: true
      - text: Los gobernantes
        correct: false
      - text: Los filósofos
        correct: false
      - text: Los ricos
        correct: false

  - question: ¿Qué decidió Pablo no saber entre ellos?
    answers:
      - text: Nada excepto a Jesucristo, y este crucificado
        correct: true
      - text: Las leyes romanas
        correct: false
      - text: La filosofía griega
        correct: false
      - text: Los misterios egipcios
        correct: false

  - question: ¿Cómo vino Pablo a los corintios?
    answers:
      - text: Con debilidad, temor y mucho temblor
        correct: true
      - text: Con autoridad militar
        correct: false
      - text: Con riqueza y prestigio
        correct: false
      - text: Con sabiduría humana
        correct: false

  - question: ¿En qué debía descansar la fe de los corintios?
    answers:
      - text: En el poder de Dios
        correct: true
      - text: En la sabiduría humana
        correct: false
      - text: En señales políticas
        correct: false
      - text: En tradiciones antiguas
        correct: false

  - question: ¿Quién conoce las profundidades de Dios?
    answers:
      - text: El Espíritu de Dios
        correct: true
      - text: Los filósofos
        correct: false
      - text: Los gobernantes de este siglo
        correct: false
      - text: Los escribas
        correct: false

  - question: ¿Qué no puede aceptar el hombre natural?
    answers:
      - text: Las cosas del Espíritu de Dios
        correct: true
      - text: Las leyes romanas
        correct: false
      - text: Los sacrificios judíos
        correct: false
      - text: Las riquezas materiales
        correct: false

  - question: ¿Qué afirma Pablo que los creyentes tienen?
    answers:
      - text: La mente de Cristo
        correct: true
      - text: El poder de Roma
        correct: false
      - text: La gloria del templo
        correct: false
      - text: La sabiduría de Grecia
        correct: false