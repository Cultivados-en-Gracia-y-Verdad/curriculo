id: 1corintios-5

title: 1 Corintios 5

questions:

  - question: ¿Qué pecado grave se mencionaba entre los corintios?
    answers:
      - text: Inmoralidad sexual
        correct: true
      - text: Robo en el templo
        correct: false
      - text: Idolatría pública
        correct: false
      - text: Rebelión política
        correct: false

  - question: ¿Qué actitud tenían los corintios frente al pecado mencionado?
    answers:
      - text: Estaban arrogantes
        correct: true
      - text: Estaban llorando
        correct: false
      - text: Estaban ayunando
        correct: false
      - text: Estaban perseguidos
        correct: false

  - question: ¿Qué instrucción dio Pablo respecto al hombre involucrado?
    answers:
      - text: Entregarlo a Satanás
        correct: true
      - text: Nombrarlo anciano
        correct: false
      - text: Enviarlo a Jerusalén
        correct: false
      - text: Ocultar el asunto
        correct: false

  - question: ¿Qué compara Pablo con la influencia del pecado?
    answers:
      - text: La levadura
        correct: true
      - text: El fuego
        correct: false
      - text: El aceite
        correct: false
      - text: La lluvia
        correct: false

  - question: ¿Qué debían celebrar los creyentes?
    answers:
      - text: Con sinceridad y verdad
        correct: true
      - text: Con riquezas y banquetes
        correct: false
      - text: Con poder político
        correct: false
      - text: Con sacrificios animales
        correct: false

  - question: ¿Con quiénes no debían asociarse los creyentes?
    answers:
      - text: Con alguien llamado hermano que practica inmoralidad
        correct: true
      - text: Con todos los incrédulos
        correct: false
      - text: Con extranjeros romanos
        correct: false
      - text: Con cobradores de impuestos
        correct: false

  - question: ¿Qué dice Pablo que harían si evitaran a todos los inmorales del mundo?
    answers:
      - text: Tendrían que salir del mundo
        correct: true
      - text: Tendrían que ir a Jerusalén
        correct: false
      - text: Tendrían que dejar de trabajar
        correct: false
      - text: Tendrían que abandonar la ciudad
        correct: false

  - question: ¿Quién juzga a los de afuera?
    answers:
      - text: Dios
        correct: true
      - text: Pablo
        correct: false
      - text: Los ancianos
        correct: false
      - text: Roma
        correct: false

  - question: ¿Qué debían hacer con el malvado de entre ellos?
    answers:
      - text: Expulsarlo
        correct: true
      - text: Honrarlo
        correct: false
      - text: Esconderlo
        correct: false
      - text: Promoverlo
        correct: false

  - question: ¿Qué había sido sacrificado según Pablo?
    answers:
      - text: Cristo, nuestra Pascua
        correct: true
      - text: El templo
        correct: false
      - text: Jerusalén
        correct: false
      - text: El sacerdocio
        correct: false