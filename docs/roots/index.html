<script>
let DATA = [];


fetch('/roots/ROOTS-dataset/index.json')
  .then(res => res.json())
  .then(json => {
    DATA = json;
    console.log("Loaded:", DATA.length);
  });

const input = document.getElementById('searchBox');
const results = document.getElementById('results');


function clean(str) {
  return str.toLowerCase().trim();
}

input.addEventListener('input', () => {
  const query = clean(input.value);
  results.innerHTML = '';

  if (!query) return;

  let matches = [];

  
  if (query.includes(':')) {

    const parts = query.split(' ');
    let verse = null;
    let book = null;

    parts.forEach(p => {
      if (p.includes(':')) verse = p;
      else book = p;
    });

    matches = DATA.filter(item => {
      const title = clean(item.title);

      if (book) {
        return title.includes(book) && title.includes(verse);
      }

      return title.includes(verse);
    });
  }

  
  if (matches.length === 0) {
    matches = DATA.filter(item =>
      clean(item.title).includes(query) ||
      clean(item.content).includes(query)
    );
  }

  
  matches.slice(0, 20).forEach(item => {
    const li = document.createElement('li');

    li.innerHTML = `
      <a href="${item.url}">
        <strong>${item.title}</strong>
      </a><br>
      <small>${item.content.substring(0, 120)}...</small>
    `;

    results.appendChild(li);
  });
});
</script>
