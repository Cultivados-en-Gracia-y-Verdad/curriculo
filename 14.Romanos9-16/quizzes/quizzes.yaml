Quiz 1 — After Romans 9:1–33

Focus: Has God's word failed?

1. What question drives Romans 9?

A. Why do Gentiles reject God?
B. Has the word of God failed?
C. Why are churches divided?
D. How should Christians pray?
ANSWER: B

2. According to Romans 9:6, what has not failed?

A. Israel
B. The Law
C. The word of God
D. The prophets
ANSWER: C

3. Isaac is used as an example of:

A. Human effort
B. Military victory
C. The child of promise
D. National leadership
ANSWER: C

4. Which prophet is quoted concerning those who were not God's people?

A. Jeremiah
B. Hosea
C. Ezekiel
D. Joel
ANSWER: B

5. Romans 9 emphasizes that God's purpose advances according to:

A. Human works
B. Human ancestry alone
C. God's calling
D. Political power
ANSWER: C

6. What image does Paul use to answer objections about God's rights?

A. Shepherd and sheep
B. Potter and clay
C. Vine and branches
D. King and army
ANSWER: B

7. Who attained righteousness by faith according to Romans 9?

A. Egypt
B. Assyria
C. Gentiles
D. Babylon
ANSWER: C

8. Israel pursued righteousness through:

A. Faith
B. Grace
C. Promise
D. Works of law
ANSWER: D

9. What did Israel stumble over?

A. The temple
B. The prophets
C. The stone of stumbling
D. Circumcision
ANSWER: C

10. True or False: Romans 9 concludes that God's word has failed.

A. True
B. False
ANSWER: B

Quiz 2 — After Romans 10:1–11:10

Focus: Why has Israel not responded?

1. What is Paul's desire for Israel?

A. Political freedom
B. Prosperity
C. Salvation
D. Leadership
ANSWER: C

2. Israel possessed zeal for God but lacked:

A. Courage
B. Knowledge
C. Resources
D. Prophets
ANSWER: B

3. According to Romans 10, righteousness is received through:

A. Works
B. Sacrifice
C. Faith
D. Rituals
ANSWER: C

4. "Everyone who calls on the name of the Lord will be..."

A. Blessed
B. Exalted
C. Saved
D. Rewarded
ANSWER: C

5. Faith comes from:

A. Experience
B. Obedience
C. Hearing
D. Suffering
ANSWER: C

6. Through whom does hearing come?

A. Angels
B. The word of Christ
C. Tradition
D. The Law
ANSWER: B

7. In Romans 11, Paul identifies himself as:

A. A Gentile
B. A Levite
C. An Israelite
D. A priest
ANSWER: C

8. What example from Israel's history does Paul use in Romans 11?

A. Moses
B. David
C. Elijah
D. Samuel
ANSWER: C

9. According to Romans 11, God has:

A. Rejected His people
B. Forgotten His promises
C. Preserved a remnant
D. Ended His covenant
ANSWER: C

10. True or False: Paul says God has rejected His people.

A. True
B. False
ANSWER: B

Quiz 3 — After Romans 11:11–12:21

Focus: God's mercy and the believer's response

1. Israel's transgression resulted in:

A. Judgment only
B. Salvation coming to Gentiles
C. The end of God's plan
D. The end of the Law
ANSWER: B

2. Gentile believers are warned against:

A. Prayer
B. Worship
C. Boasting
D. Fellowship
ANSWER: C

3. Romans 11 concludes with emphasis on God's:

A. Wisdom
B. Wealth
C. Temple
D. Kingdom
ANSWER: A

4. Romans 12 begins by urging believers to present their:

A. Possessions
B. Bodies
C. Offerings
D. Families
ANSWER: B

5. Believers are not to be conformed to:

A. Israel
B. Tradition
C. The world
D. Government
ANSWER: C

6. Transformation occurs through renewal of the:

A. Heart
B. Mind
C. Will
D. Strength
ANSWER: B

7. The church is compared to:

A. A temple
B. A vineyard
C. A body
D. An army
ANSWER: C

8. Spiritual gifts are given for:

A. Competition
B. Self-promotion
C. Service
D. Recognition
ANSWER: C

9. Romans 12 commands believers to:

A. Repay evil with evil
B. Overcome evil with good
C. Avoid enemies completely
D. Seek revenge
ANSWER: B

10. True or False: Vengeance belongs to God.

A. True
B. False
ANSWER: A

Quiz 4 — After Romans 13:1–14:23

Focus: Daily life and relationships

1. Romans 13 instructs believers to be subject to:

A. Church leaders only
B. Governing authorities
C. Family elders only
D. Apostles only
ANSWER: B

2. The one who loves another has fulfilled:

A. The temple service
B. The covenant signs
C. The Law
D. The prophets
ANSWER: C

3. Believers are urged to put on:

A. Wisdom
B. Christ
C. Knowledge
D. Strength
ANSWER: B

4. Romans 14 addresses disagreements concerning:

A. Prophecy
B. Baptism
C. Food and days
D. Circumcision only
ANSWER: C

5. Believers are not to:

A. Teach
B. Judge one another
C. Pray publicly
D. Gather together
ANSWER: B

6. Each believer will give an account to:

A. The church
B. Paul
C. Other believers
D. God
ANSWER: D

7. The kingdom of God is not:

A. Food and drink
B. Peace
C. Righteousness
D. Joy in the Holy Spirit
ANSWER: A

8. Believers should pursue:

A. Debate
B. Personal rights
C. Peace and edification
D. Recognition
ANSWER: C

9. Whatever is not from faith is:

A. Weakness
B. Sin
C. Error
D. Ignorance
ANSWER: B

10. True or False: Paul encourages believers to destroy one another over disputable matters.

A. True
B. False
ANSWER: B

Quiz 5 — After Romans 15–16

Focus: Unity, mission, and the gospel's continuation

1. The strong ought to bear the weaknesses of:

A. The leaders
B. The nations
C. The weak
D. The apostles
ANSWER: C

2. Christ did not:

A. Please Himself
B. Teach publicly
C. Serve others
D. Fulfill Scripture
ANSWER: A

3. Paul describes himself as a minister to:

A. Israel only
B. Gentiles
C. Rome only
D. Jerusalem only
ANSWER: B

4. Paul's ambition was:

A. To become famous
B. To build churches where others had labored
C. To preach where Christ had not been named
D. To remain in Jerusalem
ANSWER: C

5. Which destination does Paul hope to visit?

A. Egypt
B. Spain
C. Antioch
D. Ephesus
ANSWER: B

6. Who is commended at the beginning of Romans 16?

A. Priscilla
B. Junia
C. Phoebe
D. Mary
ANSWER: C

7. Which couple is specifically greeted by Paul?

A. Aquila and Priscilla
B. Zechariah and Elizabeth
C. Ananias and Sapphira
D. Philip and his daughters
ANSWER: A

8. Romans 16 warns believers to watch out for:

A. Persecution only
B. Divisions and obstacles
C. Roman officials
D. Famine
ANSWER: B

9. The letter closes by emphasizing:

A. Human wisdom
B. Church tradition
C. The gospel and God's glory
D. Political reform
ANSWER: C

10. True or False: Romans ends with praise to God.

A. True
B. False
ANSWER: A